<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d0a" />
    <title>Punktgenau ist offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: radial-gradient(900px 500px at 50% -10%, rgba(233,161,59,.14), transparent 60%), #0b0d0a;
        color: #ede7d6;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        width: min(92vw, 430px);
        border: 1px solid #26301f;
        border-radius: 24px;
        background: linear-gradient(160deg, rgba(23,28,18,.96), rgba(16,19,14,.98));
        padding: 30px;
        text-align: center;
        box-shadow: 0 24px 80px rgba(0,0,0,.45);
      }
      .logo {
        width: 74px;
        height: 74px;
        display: grid;
        place-items: center;
        margin: 0 auto 22px;
        border-radius: 22px;
        background: #e9a13b;
        color: #0b0d0a;
        font-size: 40px;
      }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
      p { margin: 12px 0 0; color: #a8b09b; line-height: 1.55; }
      a, button {
        margin-top: 24px;
        display: inline-flex;
        border: 1px solid #35402b;
        border-radius: 14px;
        padding: 12px 18px;
        background: transparent;
        color: #ede7d6;
        font: inherit;
        font-weight: 700;
        text-decoration: none;
      }
      button { cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="logo">⌖</div>
      <h1>Gerade offline</h1>
      <p>
        Punktgenau ist installiert und startet auch ohne Verbindung. Für OCR-Analyse,
        Kartentiles und neue Datenbank-Speicherungen brauchst du wieder Internet.
      </p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
